packages:
  - "apps/*"
  # Le site (bun + TanStack Start) vit dans ce dépôt comme tout le reste, mais
  # reste hors du workspace pnpm : il a son propre gestionnaire de paquets et
  # son propre verrou de dépendances. Le toolkit ne l'importe jamais, il pilote
  # son moteur en sous-processus (voir packages/toolkit/src/lib/pilote.ts).
  - "!apps/citari"
  - "packages/*"
allowBuilds:
  esbuild: true
  sharp: true
